version: 2
updates:
  # Update all GitHub Actions together. If CI passes, you know it's working.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - Dependencies
    groups:
      github-actions-updates:
        patterns: ['*']

  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - Dependencies
    groups:
      composer-dev-minor-patch:
        dependency-type: 'development'
        update-types: [minor, patch]
      # We don't bundle minor or major production assets, so they're tested individually.
      composer-patch:
        dependency-type: 'production'
        update-types: [patch]

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - Dependencies
    groups:
      npm-dev-minor-patch:
        dependency-type: 'development'
        update-types: [minor, patch]
      npm-prod-minor-patch:
        dependency-type: 'production'
        update-types: [minor, patch]
    # @wordpress/dependency-extraction-webpack-plugin externalizes certain WordPress packages, so they shouldn't be autoupdated without a min WordPress version bump too.
    allow:
      # Development dependencies should be updated freely.
      - dependency-type: 'development'
      # Locked to patch updates, so only fixes that don't break compatibility are allowed.
      - dependency-name: '@wordpress/*'
        dependency-type: 'production'
        update-types: ['version-update:semver-patch']
      - dependency-name: 'react'
        update-types: ['version-update:semver-patch']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-patch']
      # Production dependencies that WordPress bundles.
      # Keep in sync with https://github.com/WordPress/gutenberg/blob/%40wordpress/dependency-extraction-webpack-plugin%407.0.0/packages/dependency-extraction-webpack-plugin/lib/util.js#L2
      - dependency-name: '@wordpress/icons'
